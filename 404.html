<body>
<main>
<h1 style="font-size:1.6rem;margin:0 0 8px">That page isn’t here.</h1>
<p>Taking you to the right place…</p>
<p><a href="/">Back to LaurenAppL</a></p>
</main>
<script>
/* Typing laurenappl.com/shop (or /returns, /play, and so on) lands here. The site's pages live after a #, so send the visitor to the matching one. */
(function () {
  var seg = location.pathname.replace(/^\/+|\/+$/g, '').split('/')[0].toLowerCase().replace(/\.html?$/, '');
  var alias = { 'high-scores': 'scores', highscores: 'scores', leaderboard: 'scores', 'upcoming-projects': 'upcoming', 'returns-and-refunds': 'returns', basket: 'cart', checkout: 'cart' };
  seg = alias[seg] || seg;
  var ok = { work: 1, shop: 1, play: 1, scores: 1, about: 1, contact: 1, cart: 1, upcoming: 1, shipping: 1, returns: 1, privacy: 1, terms: 1 };
  location.replace('/' + (ok[seg] ? '#' + seg : ''));
})();
</script>
<noscript><meta http-equiv="refresh" content="3;url=/"></noscript>
</body>
</html>
